# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
      VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    strategy:
    # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows-release
            cmake_extra_args: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            cmake_extra_args: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            cmake_extra_args: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build/${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.vcpkg_triplet }}-${{ matrix.build_type }}" >> "$GITHUB_OUTPUT"
        echo "vcpkg-installed-dir=${{ github.workspace }}/vcpkg_installed/${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.vcpkg_triplet }}" >> "$GITHUB_OUTPUT"
        baseline=$(sed -n 's/.*"baseline": *"\([^"]*\)".*/\1/p' vcpkg-configuration.json)
        echo "VCPKG_COMMIT=$baseline" >> "$GITHUB_ENV"
    - name: Restore vcpkg downloads
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DOWNLOADS }}
        key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-downloads-${{ runner.os }}-

    - name: Cache vcpkg installed
      uses: actions/cache@v4
      id: vcpkg-cache
      with:
        path: ${{ steps.strings.outputs.vcpkg-installed-dir }}
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.vcpkg_triplet }}-
    
    - name: Restore ccache
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ matrix.c_compiler }}-${{ hashFiles('internal/**/*.cpp', 'internal/**/*.h', 'CMakeLists.txt') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.c_compiler }}-

    - name: Restore sccache
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-${{ runner.os }}-${{ matrix.c_compiler }}-${{ hashFiles('internal/**/*.cpp', 'internal/**/*.h', 'CMakeLists.txt') }}
        restore-keys: |
          sccache-${{ runner.os }}-${{ matrix.c_compiler }}-

    - name: Prepare MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Prepare Linux tools
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ccache ninja-build zip unzip tar curl
        cmake --version
        ninja --version

    - name: Prepare ccache
      if: runner.os == 'Linux'
      run: |
        ccache --version
        ccache --zero-stats

    - name: Prepare sccache
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install sccache -y --no-progress
        sccache --version
        sccache --zero-stats

    - name: Prepare vcpkg directories
      shell: bash
      run: |
        mkdir -p "$VCPKG_DOWNLOADS"
        mkdir -p "${{ steps.strings.outputs.vcpkg-installed-dir }}"

    - name: Checkout vcpkg
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
        git -C "$VCPKG_DIR" checkout --force "$VCPKG_COMMIT"

    - name: Bootstrap vcpkg
      if: runner.os == 'Linux'
      shell: bash
      run: "$VCPKG_DIR/bootstrap-vcpkg.sh -disableMetrics"

    - name: Bootstrap vcpkg
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "$env:VCPKG_DIR/bootstrap-vcpkg.bat" -disableMetrics'

    - name: Configure CMake
      run: >
        cmake -S ${{ github.workspace }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_DIR }}/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_INSTALLED_DIR=${{ steps.strings.outputs.vcpkg-installed-dir }}
        -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
        ${{ matrix.cmake_extra_args }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} -R self_test --output-on-failure

    - name: Show ccache stats
      if: runner.os == 'Linux'
      run: ccache --show-stats

    - name: Show sccache stats
      if: runner.os == 'Windows'
      run: sccache --show-stats